<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Folio ERP workflow demo</title>
  <desc id="description">A neutral diagram showing document intake, review, accounting, and settlement stages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#090d11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ca7d4d"/>
      <stop offset="1" stop-color="#f0b487"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1080" cy="90" r="220" fill="#234260" opacity=".18"/>
  <circle cx="90" cy="610" r="260" fill="#ca7d4d" opacity=".12"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".08">
    <path d="M0 112.5h1200M0 225h1200M0 337.5h1200M0 450h1200M0 562.5h1200"/>
    <path d="M200 0v675M400 0v675M600 0v675M800 0v675M1000 0v675"/>
  </g>
  <text x="92" y="110" fill="#f0b487" font-family="ui-monospace, monospace" font-size="22" letter-spacing="5">WORKING PROTOTYPE</text>
  <text x="92" y="180" fill="#f7f1e9" font-family="Arial, sans-serif" font-size="62" font-weight="700">Folio ERP</text>
  <text x="92" y="226" fill="#b6aa9d" font-family="Arial, sans-serif" font-size="27">A financial workflow from document intake to settlement</text>
  <g transform="translate(92 330)" font-family="Arial, sans-serif">
    <g>
      <rect width="210" height="132" rx="24" fill="#171f28" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="40" cy="40" r="18" fill="url(#accent)"/>
      <text x="72" y="47" fill="#f7f1e9" font-size="23" font-weight="700">Intake</text>
      <text x="28" y="91" fill="#b6aa9d" font-size="18">Documents and data</text>
    </g>
    <path d="M226 66h58" stroke="#f0b487" stroke-width="3" stroke-linecap="round"/>
    <path d="m275 55 12 11-12 11" fill="none" stroke="#f0b487" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(300)">
      <rect width="210" height="132" rx="24" fill="#171f28" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="40" cy="40" r="18" fill="url(#accent)"/>
      <text x="72" y="47" fill="#f7f1e9" font-size="23" font-weight="700">Review</text>
      <text x="28" y="91" fill="#b6aa9d" font-size="18">Roles and approvals</text>
    </g>
    <path d="M526 66h58" stroke="#f0b487" stroke-width="3" stroke-linecap="round"/>
    <path d="m575 55 12 11-12 11" fill="none" stroke="#f0b487" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(600)">
      <rect width="210" height="132" rx="24" fill="#171f28" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="40" cy="40" r="18" fill="url(#accent)"/>
      <text x="72" y="47" fill="#f7f1e9" font-size="23" font-weight="700">Accounting</text>
      <text x="28" y="91" fill="#b6aa9d" font-size="18">Checks and records</text>
    </g>
    <path d="M826 66h58" stroke="#f0b487" stroke-width="3" stroke-linecap="round"/>
    <path d="m875 55 12 11-12 11" fill="none" stroke="#f0b487" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(900)">
      <rect width="210" height="132" rx="24" fill="#171f28" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="40" cy="40" r="18" fill="url(#accent)"/>
      <text x="72" y="47" fill="#f7f1e9" font-size="23" font-weight="700">Settlement</text>
      <text x="28" y="91" fill="#b6aa9d" font-size="18">Final status and audit</text>
    </g>
  </g>
  <text x="92" y="570" fill="#b6aa9d" font-family="Arial, sans-serif" font-size="20">Local AI suggestions remain subject to human review.</text>
